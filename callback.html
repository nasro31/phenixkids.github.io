<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorisation TikTok — PhenixKids</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">PK</span><span><strong>PhenixKids</strong><small>Connexion TikTok</small></span></a></header>
<main class="callback-shell section-shell"><section class="callback-card"><span class="callback-icon" aria-hidden="true">✓</span><p class="eyebrow" id="callback-kicker">Retour d’autorisation</p><h1 id="callback-title">Vérification en cours…</h1><p id="callback-message">PhenixKids vérifie la réponse reçue de TikTok.</p><button class="button button-primary" id="copy-url" type="button" hidden>Copier l’adresse de retour</button><p class="callback-help">Ne partagez jamais cette adresse avec une autre personne. Elle peut contenir un code d’autorisation temporaire.</p></section></main>

<script>
const params=new URLSearchParams(location.search);const code=params.get('code');const error=params.get('error');const title=document.querySelector('#callback-title');const message=document.querySelector('#callback-message');const icon=document.querySelector('.callback-icon');const button=document.querySelector('#copy-url');if(code){title.textContent='Autorisation reçue';message.textContent='Retournez maintenant dans PhenixKids Studio pour terminer la connexion à votre compte TikTok.';button.hidden=false}else if(error){title.textContent='Autorisation interrompue';message.textContent='TikTok n’a pas accordé l’autorisation. Vous pouvez fermer cette page et recommencer depuis le Studio.';icon.textContent='!';icon.classList.add('error')}else{title.textContent='Aucune autorisation à traiter';message.textContent='Cette page est utilisée uniquement après une connexion lancée depuis PhenixKids Studio.';icon.textContent='i'}button.addEventListener('click',async()=>{await navigator.clipboard.writeText(location.href);button.textContent='Adresse copiée'});
</script></body></html>
